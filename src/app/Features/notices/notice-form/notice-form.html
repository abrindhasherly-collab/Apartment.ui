<div class="form-page">

  <div class="form-card">

    <h2>

      @if (isEdit()) {
        Edit Notice
      } @else {
        Add Notice
      }

    </h2>

    <form
      [formGroup]="noticeForm"
      (ngSubmit)="saveNotice()">

      <div class="form-group">

        <label>Title</label>

        <input
          type="text"
          formControlName="title"
          placeholder="Enter notice title">

      </div>

      <div class="form-group">

        <label>Description</label>

        <textarea
          formControlName="description"
          placeholder="Enter notice description">
        </textarea>

      </div>

      @if (!isEdit()) {

        <div class="form-group">

          <label>Posted By</label>

          <input
            type="number"
            formControlName="postedBy">

        </div>

      }

      <div class="form-group">

        <label>Status</label>

        <select formControlName="status">

          <option [ngValue]="1">
            Draft
          </option>

          <option [ngValue]="2">
            Published
          </option>

          <option [ngValue]="3">
            Archived
          </option>

        </select>

      </div>

      @if (errorMessage()) {

        <p class="error">
          {{ errorMessage() }}
        </p>

      }

      <div class="buttons">

        <button
          type="submit"
          [disabled]="loading()">

          @if (loading()) {
            Saving...
          } @else if (isEdit()) {
            Update
          } @else {
            Save
          }

        </button>

        <button
          type="button"
          class="cancel"
          (click)="cancel()">

          Cancel

        </button>

      </div>

    </form>

  </div>

</div>
