<div class="form-page">

  <div class="form-card">

    <h2>

      @if (isEdit()) {
        Edit User
      } @else {
        Add User
      }

    </h2>

    <form
      [formGroup]="userForm"
      (ngSubmit)="saveUser()">

      <div class="form-group">

        <label>Name</label>

        <input
          type="text"
          formControlName="name"
          placeholder="Enter name">

      </div>

      <div class="form-group">

        <label>Email</label>

        <input
          type="email"
          formControlName="email"
          placeholder="Enter email">

      </div>

      @if (!isEdit()) {

        <div class="form-group">

          <label>Password</label>

          <input
            type="password"
            formControlName="password"
            placeholder="Enter password">

        </div>

      }

      <div class="form-group">

        <label>Phone Number</label>

        <input
          type="text"
          formControlName="phoneNumber"
          placeholder="Enter phone number">

      </div>

      <div class="form-group">

        <label>Role</label>

        <select formControlName="role">

          <option [ngValue]="1">
            Secretary
          </option>

          <option [ngValue]="2">
            Resident
          </option>

          <option [ngValue]="3">
            Watchman
          </option>

          <option [ngValue]="4">
            Owner
          </option>

        </select>

      </div>

      @if (isEdit()) {

        <div class="form-group">

          <label>Status</label>

          <select formControlName="status">

            <option [ngValue]="1">
              Active
            </option>

            <option [ngValue]="2">
              Inactive
            </option>

          </select>

        </div>

      }

      @if (errorMessage()) {

        <p class="error">
          {{ errorMessage() }}
        </p>

      }

      <div class="buttons">

        <button
          type="submit"
          [disabled]="loading()">

          @if (loading()) {
            Saving...
          } @else if (isEdit()) {
            Update
          } @else {
            Save
          }

        </button>

        <button
          type="button"
          class="cancel"
          (click)="cancel()">

          Cancel

        </button>

      </div>

    </form>

  </div>

</div>
