
<div class="register-container">

  <div class="register-card">

    <!-- APARTMENT LOGO -->

    <div class="apartment-logo">
      🏢
    </div>


    <!-- APARTMENT NAME -->

    <h1>
      Apartment Management
    </h1>

    <p class="welcome-text">
      Create your account to continue.
    </p>


    <h2>
      Register
    </h2>


    <!-- REGISTER FORM -->

    <form
      [formGroup]="registerForm"
      (ngSubmit)="register()"
      autocomplete="off">


      <!-- NAME -->

      <div class="form-group">

        <label>
          Name
        </label>

        <input
          type="text"
          formControlName="name"
          placeholder="Enter name"
          autocomplete="off">

      </div>


      <!-- EMAIL -->

      <div class="form-group">

        <label>
          Email
        </label>

        <input
          type="email"
          formControlName="email"
          placeholder="Enter email"
          autocomplete="off">

      </div>


      <!-- PASSWORD -->

      <div class="form-group">

        <label>
          Password
        </label>

        <input
          type="password"
          formControlName="password"
          placeholder="Enter password"
          autocomplete="new-password">

      </div>


      <!-- CONFIRM PASSWORD -->

      <div class="form-group">

        <label>
          Confirm Password
        </label>

        <input
          type="password"
          formControlName="confirmPassword"
          placeholder="Confirm password"
          autocomplete="new-password">

      </div>


      <!-- PHONE -->

      <div class="form-group">

        <label>
          Phone Number
        </label>

        <input
          type="text"
          formControlName="phoneNumber"
          placeholder="Enter phone number"
          autocomplete="off">

      </div>


      <!-- KEEPING YOUR ORIGINAL EMPTY FORM GROUP -->

      <div class="form-group">

      </div>


      <!-- ERROR -->

      @if (errorMessage()) {

        <p class="error">
          {{ errorMessage() }}
        </p>

      }


      <!-- REGISTER BUTTON -->

      <button
        type="submit"
        [disabled]="loading()">

        @if (loading()) {

          Registering...

        } @else {

          Register

        }

      </button>

    </form>


    <!-- LOGIN LINK -->

    <p class="login-text">

      Already have an account?

      <a routerLink="/login">
        Login
      </a>

    </p>


    <!-- FOOTER -->

    <div class="register-footer">

      <span>
        Qwin Elite Apartments
      </span>

    </div>

  </div>

</div>
